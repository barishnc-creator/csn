name: Masaüstü (Windows)
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx electron-builder --win --publish never
        env:
          # İmzalama sertifikası yok; otomatik sertifika arama kapalı
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Soundpad genel kısayolları: tuş dinleme modülü pakette mi ve paketlenmiş uygulamada yükleniyor mu
      - name: Genel kısayol modülünü doğrula
        shell: pwsh
        run: |
          $unpacked = "dist/win-unpacked/resources/app.asar.unpacked/node_modules/uiohook-napi"
          if (-not (Test-Path "$unpacked/prebuilds/win32-x64")) { Get-ChildItem -Recurse dist/win-unpacked/resources | Select-Object -First 40; throw "uiohook-napi pakete girmemiş" }
          $env:ELECTRON_RUN_AS_NODE = "1"
          $asar = (Resolve-Path "dist/win-unpacked/resources/app.asar").Path
          & "dist/win-unpacked/CSN.exe" -e "const h=require(process.argv[1]+'/node_modules/uiohook-napi'); if(!h.uIOhook||!h.UiohookKey) process.exit(2); console.log('uiohook OK', Object.keys(h.UiohookKey).length)" $asar
          if ($LASTEXITCODE -ne 0) { throw "uiohook-napi paketlenmiş uygulamada yüklenemedi ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        with:
          name: CSN-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
      - name: Sürümü oku
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Elle başlatınca da indirme sayfası (Release) ve etiket otomatik oluşur
      - uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          tag_name: desktop-v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CSN Masaüstü ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            Windows kurulum dosyası. `CSN-Kurulum-...exe` dosyasını indirip çalıştırın; CSN otomatik açılır.
            İlk açılışta Windows "bilinmeyen yayıncı" uyarısı verirse **Ek bilgi → Yine de çalıştır** deyin (uygulama imzalı değil).
